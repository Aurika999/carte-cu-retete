<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Be Fit From Home">
  <!-- Be Fit From Home: carte deschisă (rețete) + ganteră (exerciții) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c76b"/>
      <stop offset="1" stop-color="#d9a03c"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3ead6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#bg)"/>
  <g transform="translate(32 32.5) scale(0.78) translate(-32 -31.5)">
  <!-- gantera -->
  <g fill="#173c2b">
    <rect x="17" y="13.5" width="30" height="3.4" rx="1.7"/>
    <rect x="12" y="9" width="5.2" height="12.4" rx="1.8"/>
    <rect x="46.8" y="9" width="5.2" height="12.4" rx="1.8"/>
    <rect x="8.4" y="11.2" width="4" height="8" rx="1.5"/>
    <rect x="51.6" y="11.2" width="4" height="8" rx="1.5"/>
  </g>
  <!-- cartea -->
  <path d="M32 29 C26 25 17 24.5 9.5 26 L9.5 51 C17 49.5 26 50 32 54 Z" fill="url(#page)" stroke="#173c2b" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M32 29 C38 25 47 24.5 54.5 26 L54.5 51 C47 49.5 38 50 32 54 Z" fill="url(#page)" stroke="#173c2b" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M32 29 L32 54" stroke="#173c2b" stroke-width="2.4" stroke-linecap="round"/>
  <!-- rândurile din carte -->
  <g stroke="#2c6b4a" stroke-width="1.8" stroke-linecap="round" opacity=".55">
    <path d="M14.5 32.5 C19 31.8 23.5 32 27.5 33.5"/>
    <path d="M14.5 37.5 C19 36.8 23.5 37 27.5 38.5"/>
    <path d="M14.5 42.5 C19 41.8 23.5 42 27.5 43.5"/>
  </g>
  <!-- frunză (alimentație sănătoasă) pe pagina din dreapta -->
  <path d="M38 45 C38 36 44 32.5 50 33 C50.5 40 46 45.5 38 45 Z" fill="#4f9d3a"/>
  <path d="M38.5 44.5 C42 41 45 38.5 48.5 35" stroke="#e9f5e4" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
